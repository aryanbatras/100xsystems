# ─── Certificate Automation ──────────────────────────────────────────
# When a submission Pull Request is merged (with label "verified"),
# this workflow:
#   1. Finds the merged submission directory
#   2. Reads metadata.json for author, system, language
#   3. Generates a SHA256 certificate ID
#   4. Creates a certificate HTML page with all details
#   5. Commits the certificate to docs/certificates/{certId}/
#   6. Posts a congratulatory comment on the PR
#
# This is the zero-cost certificate system — no backend needed.
# The certificate is served as a static page on the website:
#   https://100xsystems.dev/verify/{certId}

name: issue-certificate

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  certificate:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'verified')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write helper scripts
        run: |
          # Write metadata generator script (uses heredoc to avoid escaping issues)
          cat > /tmp/generate-meta.mjs << 'ENDSCRIPT'
          import fs from 'fs';
          import crypto from 'crypto';

          const [metaFile, prUrl, prNumber, author] = process.argv.slice(2);
          const meta = JSON.parse(fs.readFileSync(metaFile, 'utf-8'));

          const certId = crypto.createHash('sha256')
            .update(`${prUrl}-${metaFile}-${Date.now()}`)
            .digest('hex')
            .substring(0, 16);

          const certData = {
            id: certId,
            author: meta.author || author,
            authorUrl: meta.repositoryUrl || '',
            systemSlug: meta.system || '',
            systemTitle: meta.systemTitle || meta.system || 'Unknown',
            difficulty: meta.difficulty || 'Intermediate',
            language: meta.language || 'Unknown',
            score: 100,
            completedAt: new Date().toISOString(),
            tags: meta.tags || [],
            prUrl: prUrl,
            prNumber: parseInt(prNumber, 10),
          };

          fs.writeFileSync('/tmp/cert-output.json', JSON.stringify(certData, null, 2));
          console.log(certId);
          ENDSCRIPT

          # Write HTML generator script
          cat > /tmp/generate-html.mjs << 'ENDSCRIPT'
          import fs from 'fs';

          const certId = process.argv[2];
          const inputData = fs.readFileSync(`docs/certificates/${certId}/metadata.json`, 'utf-8');
          const data = JSON.parse(inputData);

          const completedDate = new Date(data.completedAt).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });

          const tagsHtml = data.tags && data.tags.length > 0
            ? data.tags.map(t => `<span class="tag">${t}</span>`).join('')
            : '';

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Certificate — ${data.systemTitle} — 100xSystems</title>
            <meta name="description" content="Verified certificate for ${data.author} completing ${data.systemTitle}.">
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; display: flex; justify-content: center; padding: 80px 20px; }
              .certificate { max-width: 700px; width: 100%; background: white; border: 2px solid #e5e7eb; padding: 60px 80px; }
              .header { text-align: center; margin-bottom: 40px; }
              .header h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.15em; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; }
              .header .title { font-size: 24px; font-weight: 300; color: #374151; letter-spacing: 0.05em; }
              .divider { width: 64px; height: 1px; background: #d1d5db; margin: 24px auto; }
              .awarded { text-align: center; }
              .awarded .label { font-size: 10px; font-weight: 500; letter-spacing: 0.15em; color: #9ca3af; margin-bottom: 12px; text-transform: uppercase; }
              .awarded .name { font-size: 32px; font-weight: 700; color: #111827; margin-bottom: 8px; }
              .awarded .github { font-size: 12px; color: #9ca3af; margin-bottom: 32px; }
              .awarded .completed-label { font-size: 11px; color: #9ca3af; margin-bottom: 8px; }
              .awarded .system { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 4px; }
              .awarded .meta { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }
              .footer { display: flex; justify-content: center; gap: 32px; font-size: 12px; color: #9ca3af; margin-top: 24px; }
              .footer span { font-family: 'Courier New', monospace; color: #4b5563; }
              .verify-url { text-align: center; font-size: 10px; color: #d1d5db; margin-top: 24px; font-family: monospace; }
              .tags { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
              .tag { font-size: 9px; font-weight: 500; letter-spacing: 0.1em; padding: 2px 8px; background: #f3f4f6; color: #6b7280; text-transform: uppercase; }
            </style>
          </head>
          <body>
            <div class="certificate">
              <div class="header">
                <h1>100X Systems</h1>
                <p class="title">Certificate of Completion</p>
              </div>
              <div class="divider"></div>
              <div class="awarded">
                <p class="label">Awarded to</p>
                <p class="name">${data.author}</p>
                ${data.authorUrl ? `<p class="github">${data.authorUrl.replace('https://github.com/', '')}</p>` : ''}
                <p class="completed-label">Has successfully completed</p>
                <p class="system">${data.systemTitle}</p>
                <p class="meta">${data.difficulty} · ${data.language}</p>
                <div class="divider"></div>
                <p class="completed-label">Completed ${completedDate}</p>
              </div>
              ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
              <div class="footer">
                <span>Code: ${data.id}</span>
                <a href="${data.prUrl}" style="color: #6366f1; text-decoration: none; font-weight: 600;">View PR #${data.prNumber}</a>
              </div>
              <p class="verify-url">100xsystems.dev/verify/${data.id}</p>
            </div>
          </body>
          </html>`;

          fs.writeFileSync(`docs/certificates/${certId}/index.html`, html);
          console.log(`Certificate ${certId} generated`);
          ENDSCRIPT

          echo "Helper scripts written to /tmp/"

      - name: Process merged submission
        id: process
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "PR #${PR_NUMBER} merged"

          # Find the submission directory added in this PR
          NEW_DIR=$(git diff --name-only HEAD~1 2>/dev/null | grep '^submissions/' | head -1 | cut -d'/' -f1-3 || echo "")

          if [ -z "$NEW_DIR" ]; then
            echo "No submission found in this PR — skipping certificate generation"
            exit 0
          fi

          echo "new_dir=${NEW_DIR}" >> $GITHUB_OUTPUT
          echo "Found submission: ${NEW_DIR}"

      - name: Generate certificate metadata
        if: steps.process.outputs.new_dir != ''
        id: metadata
        run: |
          NEW_DIR="${{ steps.process.outputs.new_dir }}"
          META_FILE="${NEW_DIR}/metadata.json"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Generate certificate + create directory
          CERT_ID=$(node /tmp/generate-meta.mjs "${META_FILE}" "${PR_URL}" "${PR_NUMBER}" "${AUTHOR}")
          echo "cert_id=${CERT_ID}" >> $GITHUB_OUTPUT

          mkdir -p "docs/certificates/${CERT_ID}"
          cp /tmp/cert-output.json "docs/certificates/${CERT_ID}/metadata.json"

          # Update original metadata with certificate info
          node -e "
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('${META_FILE}', 'utf-8'));
            meta.certificateId = '${CERT_ID}';
            meta.pullRequestUrl = '${PR_URL}';
            meta.prNumber = ${PR_NUMBER};
            meta.status = 'verified';
            meta.verifiedAt = new Date().toISOString();
            fs.writeFileSync('${META_FILE}', JSON.stringify(meta, null, 2) + '\n');
          "

          echo "Certificate ID: ${CERT_ID}"

      - name: Generate certificate HTML
        if: steps.metadata.outputs.cert_id != ''
        run: |
          node /tmp/generate-html.mjs "${{ steps.metadata.outputs.cert_id }}"

      - name: Commit certificate
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "certificate: PR #${{ github.event.pull_request.number }} [skip ci]"
          file_pattern: 'docs/certificates/* submissions/*/metadata.json'
          commit_user_name: '100xSystems Bot'
          commit_user_email: 'bot@100xsystems.dev'

      - name: Post congratulatory comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const certId = '${{ steps.metadata.outputs.cert_id }}';
            const prNumber = ${{ github.event.pull_request.number }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🎉 **Congratulations! Your submission has been verified!**\n\n` +
                    `A certificate of completion has been issued:\n\n` +
                    `🔗 **Verify Certificate:** https://100xsystems.dev/verify/${certId}\n\n` +
                    `---\n` +
                    `_This certificate proves that your implementation passed community review._\n` +
                    `_Share it on LinkedIn, GitHub, or your portfolio!_`
            });
